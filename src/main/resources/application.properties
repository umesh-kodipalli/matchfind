spring.application.name=person-backend

# ----------------------------------------------------------------------------
# Datasource (MySQL)
# ----------------------------------------------------------------------------
# createDatabaseIfNotExist=true lets the app create the "persondb" schema on
# first connection if it doesn't already exist (the MySQL user still needs
# CREATE privileges). Remove that param if your DBA provisions schemas
# separately.
spring.datasource.url=jdbc:mysql://localhost:3306/persondb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=YOUR_PASSWORD
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ----------------------------------------------------------------------------
# JPA / Hibernate
# ----------------------------------------------------------------------------
# "update" auto-creates/updates the person_names table from the Person
# entity on startup. Fine for development; for a real production rollout,
# prefer a migration tool (Flyway/Liquibase) and set this to "validate".
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ----------------------------------------------------------------------------
# Server
# ----------------------------------------------------------------------------
server.port=5000
